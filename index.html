<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kid Log">
<meta name="theme-color" content="#f6f4ef">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Kid Log</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #6b6f76; --line: #e4e0d8;
    --good: #2f7d62; --good-soft: #e3f1ea; --hard: #b5562f; --hard-soft: #f8e7dd;
    --chip: #efece6; --chip-on: #1f2328; --chip-on-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --card: #1e2023; --ink: #eceae6; --muted: #9a9ea5; --line: #2e3135;
      --good: #5cc29b; --good-soft: #1b2e27; --hard: #ee8f63; --hard-soft: #35231b;
      --chip: #2a2c30; --chip-on: #eceae6; --chip-on-ink: #141517;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 22px 0 8px; }
  h3 { font-size: 14px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .who { background: var(--chip); padding: 6px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); }
  .tabs { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
  .tabs button { flex: 1; padding: 8px; border-radius: 10px; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .big { border-radius: 18px; padding: 20px 14px; min-height: 120px; text-align: left; display: flex;
    flex-direction: column; justify-content: space-between; }
  .big .kid { font-size: 24px; font-weight: 700; }
  .big .lbl { font-size: 15px; font-weight: 600; }
  .big.good { background: var(--good-soft); color: var(--good); }
  .big.hard { background: var(--hard-soft); color: var(--hard); }
  .big:active { transform: scale(.97); }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
  .row:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
  .dot.good { background: var(--good); } .dot.hard { background: var(--hard); }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; }
  .row .s { color: var(--muted); font-size: 14px; }
  .row .x { color: var(--muted); font-size: 13px; padding: 2px 4px; }
  .empty { color: var(--muted); padding: 16px 14px; }

  /* detail sheet */
  .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 120px; display: none; }
  .sheet.open { display: block; }
  .sheet-in { max-width: 560px; margin: 0 auto; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .sheet-head .title { font-size: 20px; font-weight: 700; }
  .sheet-head .title.good { color: var(--good); } .sheet-head .title.hard { color: var(--hard); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--chip); padding: 9px 13px; border-radius: 999px; font-size: 15px; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
  textarea, input[type=datetime-local], input[type=date] { width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  textarea { min-height: 96px; resize: vertical; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: linear-gradient(transparent, var(--bg) 30%); z-index: 11; display: none; }
  .bar.open { display: block; }
  .save { display: block; width: 100%; max-width: 528px; margin: 0 auto; padding: 16px; border-radius: 14px;
    font-size: 18px; font-weight: 700; color: #fff; }
  .save.good { background: var(--good); } .save.hard { background: var(--hard); }
  .save:disabled { opacity: .6; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; display: none;
    gap: 16px; align-items: center; z-index: 20; white-space: nowrap; }
  .toast.show { display: flex; }
  .toast button { color: var(--bg); font-weight: 700; text-decoration: underline; }

  /* summary */
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 26px; line-height: 1.1; }
  .stat.good { background: var(--good-soft); color: var(--good); }
  .stat.hard { background: var(--hard-soft); color: var(--hard); }
  .days { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin-top: 6px; }
  .day { flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; }
  .day i { display: block; border-radius: 3px; }
  .day i.g { background: var(--good); } .day i.h { background: var(--hard); }
  .daylbl { display: flex; gap: 4px; font-size: 11px; color: var(--muted); }
  .daylbl span { flex: 1; text-align: center; }
  .tally { display: flex; justify-content: space-between; padding: 4px 0; font-size: 15px; }
  .tally span:last-child { color: var(--muted); }
  .ev { padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .ev:first-child { border-top: 0; }
  .ev .s { color: var(--muted); font-size: 13px; }
  .copy { width: 100%; padding: 14px; border-radius: 12px; background: var(--chip); font-weight: 600; }
  .copy.main { background: var(--chip-on); color: var(--chip-on-ink); }
  .dates { display: flex; gap: 10px; margin: -4px 0 14px; }
  .dates label { flex: 1; font-size: 13px; color: var(--muted); }
  .dates input { margin-top: 4px; padding: 10px; }
  .span { font-size: 15px; font-weight: 600; margin: -4px 2px 12px; }
</style>
</head>
<body>
<header>
  <h1>Kid Log</h1>
  <button class="who" id="whoBtn" onclick="pickWho()">…</button>
</header>
<div class="tabs">
  <button id="tabLog" class="on" onclick="showTab('log')">Log</button>
  <button id="tabSum" onclick="showTab('sum')">Summary</button>
</div>

<section id="viewLog">
  <div class="grid" id="grid"></div>
  <p class="hint">Tap once, then Save. Everything else is optional. To talk instead of type, tap the 🎤 on the keyboard.</p>
  <h2>Today</h2>
  <div class="list" id="today"><div class="empty">Loading…</div></div>
</section>

<section id="viewSum" style="display:none">
  <div class="chips" id="range" style="margin-bottom:14px"></div>
  <div id="rangeDates"></div>
  <div id="summary"></div>
</section>

<div class="sheet" id="sheet"><div class="sheet-in">
  <div class="sheet-head">
    <span class="title" id="sheetTitle"></span>
    <button onclick="closeSheet()" style="color:var(--muted)">Cancel</button>
  </div>
  <div id="form"></div>
</div></div>
<div class="bar" id="bar"><button class="save" id="saveBtn" onclick="save()">Save</button></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
// No names or key live in this public file: the family key arrives in the link's #k=… part
// (never sent to GitHub) and unlocks the names and entries from the Apps Script API.
const API = 'https://script.google.com/macros/s/AKfycbyeuuBHGADfrDJLA0vCVQCF082IjUMTCtUtHdQJb8WxLogXW4WoMH4SGsHPvSaL_9LNAA/exec';
// Accept the key from #k= or ?k= (iOS can drop the #part when saving to the Home Screen), else from storage.
const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || new URLSearchParams(location.search).get('k')
  || store('key');
let CFG = { kids: [], loggers: [] };

const OPTIONS = {
  when: ['Now', '15 min ago', '30 min ago', '1 hr ago', '2 hrs ago', 'Pick date & time'],
  good: {
    what: ['Kind to sibling', 'Followed directions', 'Used a coping skill', 'Calm through a transition',
      'Handled "no" well', 'Helped out', 'Honest / owned it', 'Played well with others', 'Connected / good talk', 'Other'],
    response: ['Praised it', 'Reward / points', 'Quality time', 'Just noticed it'],
    responseLabel: 'How we responded',
  },
  hard: {
    what: ['Meltdown / tantrum', 'Aggression (hit, kick, throw)', 'Refused / defiant', 'Yelling / mean words',
      'Sibling conflict', 'Anxious / worried', 'Shut down / withdrawn', 'Unsafe behavior', 'Lying', 'Other'],
    intensity: ['Mild', 'Moderate', 'Severe'],
    duration: ['Under 5 min', '5–15 min', '15–30 min', '30+ min'],
    triggers: ['Transition', 'Told "no"', 'Sibling', 'Screens ending', 'Homework', 'Morning routine',
      'Bedtime', 'Hungry / tired', 'Unknown'],
    response: ['Coping skill', 'Break / space', 'Co-regulation / hug', 'Redirection', 'Ignored behavior',
      'Consequence', 'Praise once calm', 'Nothing helped'],
    responseLabel: 'What we did / what helped',
  },
};

let who = store('who');
let draft = null;
let range = 'yesterday', rangeFrom, rangeTo; // the Summary's days, midnight to midnight, both inclusive
let loadedDays = 14;
let cache = [];

// ---------- helpers ----------
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem('kidlog.' + k); localStorage.setItem('kidlog.' + k, v); } catch (e) {}
  return null;
}
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'onclick') n.onclick = v; else if (k === 'class') n.className = v; else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}
function call(fn, ...args) {
  const get = params => fetch(API + '?' + new URLSearchParams(Object.assign({ k: KEY }, params)));
  const post = body => fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ k: KEY }, body)) });
  const req = { config: () => get({ action: 'config' }), getEntries: days => get({ action: 'entries', days }),
    logEvent: ev => post({ action: 'log', ev }), deleteEvent: id => post({ action: 'delete', id }) }[fn](...args);
  return req.then(r => r.json()).then(d => {
    if (d && d.error) throw new Error(d.error);
    return fn === 'logEvent' ? d.id : fn === 'deleteEvent' ? d.ok : d;
  });
}
function fmtTime(iso) { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fmtDay(iso) { return new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' }); }
function dayKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function label(e) { return e.type === 'good' ? 'Good moment' : 'Hard moment'; }
let toastTimer;
function toast(msg, undo) {
  document.getElementById('toastMsg').textContent = msg;
  const u = document.getElementById('toastUndo');
  u.style.display = undo ? '' : 'none';
  u.onclick = () => { document.getElementById('toast').classList.remove('show'); undo && undo(); };
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => document.getElementById('toast').classList.remove('show'), 6000);
}

// ---------- who ----------
function pickWho() {
  const box = el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, 'Who is logging on this phone?'),
    el('div', { class: 'chips' }, CFG.loggers.map(n => el('button', { class: 'chip' + (n === who ? ' on' : ''),
      onclick: () => { who = n; store('who', n); renderWho(); document.getElementById('whoCard').remove(); } }, n))));
  box.id = 'whoCard';
  const old = document.getElementById('whoCard'); if (old) old.remove();
  document.getElementById('viewLog').prepend(box);
  showTab('log');
}
function renderWho() { document.getElementById('whoBtn').textContent = who ? 'as ' + who + ' ▾' : 'Who are you? ▾'; }

// ---------- log ----------
function renderGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for (const kid of CFG.kids) {
    for (const type of ['good', 'hard']) {
      g.append(el('button', { class: 'big ' + type, onclick: () => openSheet(kid, type) },
        el('span', { class: 'kid' }, kid),
        el('span', { class: 'lbl' }, type === 'good' ? '👍 Good moment' : '⚡ Hard moment')));
    }
  }
}

function openSheet(child, type) {
  draft = { child, type, when: 'Now', what: [], triggers: [], response: [], intensity: '', duration: '', notes: '', time: '' };
  const t = document.getElementById('sheetTitle');
  t.textContent = child + ' · ' + (type === 'good' ? 'Good moment' : 'Hard moment');
  t.className = 'title ' + type;
  document.getElementById('saveBtn').className = 'save ' + type;
  document.getElementById('saveBtn').textContent = 'Save';
  document.getElementById('saveBtn').disabled = false;
  renderForm();
  document.getElementById('sheet').classList.add('open');
  document.getElementById('bar').classList.add('open');
  document.getElementById('sheet').scrollTop = 0;
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('bar').classList.remove('open');
  draft = null;
}

function chipGroup(title, field, opts, multi) {
  return [el('h3', {}, title), el('div', { class: 'chips' }, opts.map(o => {
    const on = multi ? draft[field].includes(o) : draft[field] === o;
    return el('button', { class: 'chip' + (on ? ' on' : ''), onclick: () => {
      if (multi) draft[field] = on ? draft[field].filter(x => x !== o) : draft[field].concat(o);
      else draft[field] = on && field !== 'when' ? '' : o;
      renderForm();
    } }, o);
  }))];
}

function renderForm() {
  const o = OPTIONS[draft.type];
  const f = document.getElementById('form');
  const notes = draft.notes;
  f.innerHTML = '';
  f.append(...chipGroup('When', 'when', OPTIONS.when, false));
  if (draft.when === 'Pick date & time') {
    if (!draft.time) draft.time = localInput(new Date());
    const inp = el('input', { type: 'datetime-local', value: draft.time, max: localInput(new Date()), style: 'margin-top:8px' });
    inp.oninput = () => { draft.time = inp.value; };
    f.append(inp);
  }
  f.append(...chipGroup('What happened', 'what', o.what, true));
  const ta = el('textarea', { placeholder: 'Details, in your own words (tap 🎤 to dictate)' });
  ta.value = notes;
  ta.oninput = () => { draft.notes = ta.value; };
  f.append(el('h3', {}, 'Notes'), ta);
  if (draft.type === 'hard') {
    f.append(...chipGroup('How big', 'intensity', o.intensity, false));
    f.append(...chipGroup('How long', 'duration', o.duration, false));
    f.append(...chipGroup('What set it off', 'triggers', o.triggers, true));
  }
  f.append(...chipGroup(o.responseLabel, 'response', o.response, true));
}

function happenedAt() {
  const now = new Date();
  const mins = { 'Now': 0, '15 min ago': 15, '30 min ago': 30, '1 hr ago': 60, '2 hrs ago': 120 }[draft.when];
  if (mins !== undefined) return new Date(now - mins * 60000);
  const d = draft.time ? new Date(draft.time) : now;
  return isNaN(d) || d > now ? now : d;
}
// "YYYY-MM-DDTHH:MM" in local time, the format a datetime-local input uses.
function localInput(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function save() {
  if (!draft) return;
  if (!who) { pickWho(); closeSheet(); toast('Pick who you are first'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const ev = { child: draft.child, type: draft.type, happenedAt: happenedAt().toISOString(), what: draft.what,
    intensity: draft.intensity, duration: draft.duration, triggers: draft.triggers, response: draft.response,
    notes: draft.notes.trim(), by: who };
  try {
    const id = await call('logEvent', ev);
    closeSheet();
    cache.unshift(Object.assign({ id, loggedAt: new Date().toISOString() }, ev));
    cache.sort((a, b) => b.happenedAt.localeCompare(a.happenedAt));
    renderToday();
    const day = dayKey(new Date(ev.happenedAt)) === dayKey(new Date()) ? '' : ' for ' + fmtDay(ev.happenedAt);
    toast('Saved ' + ev.child + ' · ' + label(ev) + day, () => remove(id));
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Didn’t save. Tap to try again';
  }
}

async function remove(id) {
  try {
    await call('deleteEvent', id);
    cache = cache.filter(e => e.id !== id);
    renderToday(); renderSummary();
    toast('Removed');
  } catch (e) { toast('Couldn’t remove. Try again'); }
}

function summaryLine(e) {
  return [e.what.join(', '), e.intensity, e.duration, e.triggers.length ? 'trigger: ' + e.triggers.join(', ') : '',
    e.response.length ? (e.type === 'good' ? 'we: ' : 'helped/tried: ') + e.response.join(', ') : '']
    .filter(Boolean).join(' · ');
}

function renderToday() {
  const box = document.getElementById('today');
  const today = dayKey(new Date());
  const items = cache.filter(e => dayKey(new Date(e.happenedAt)) === today);
  box.innerHTML = '';
  if (!items.length) { box.append(el('div', { class: 'empty' }, 'Nothing logged yet today.')); return; }
  for (const e of items) {
    box.append(el('div', { class: 'row' }, el('span', { class: 'dot ' + e.type }),
      el('div', { class: 'main' },
        el('div', { class: 't' }, e.child + ' · ' + label(e) + ' · ' + fmtTime(e.happenedAt)),
        summaryLine(e) ? el('div', { class: 's' }, summaryLine(e)) : null,
        e.notes ? el('div', { class: 's' }, '“' + e.notes + '”') : null,
        el('div', { class: 's' }, 'by ' + e.by)),
      el('button', { class: 'x', onclick: ev => {
        // confirm() is blocked in the Apps Script sandbox, so the second tap confirms.
        const b = ev.currentTarget;
        if (b.dataset.armed) { b.textContent = 'Removing…'; remove(e.id); return; }
        b.dataset.armed = '1'; b.textContent = 'Tap to confirm'; b.style.color = 'var(--hard)';
        setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Remove'; b.style.color = ''; } }, 4000);
      } }, 'Remove')));
  }
}

// ---------- summary ----------
function tally(list, field) {
  const c = {};
  for (const e of list) for (const v of [].concat(e[field] || [])) if (v) c[v] = (c[v] || 0) + 1;
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}
function partOfDay(iso) {
  const h = new Date(iso).getHours();
  return h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : h < 20 ? 'Evening' : 'Bedtime / night';
}
function midnight(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dateInput(d) { return localInput(d).slice(0, 10); }
function fmtLong(d) { return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); }
const RANGES = [['yesterday', 'Yesterday', 1, 1], ['today', 'Today', 0, 0], ['week', 'Last 7 days', 6, 0], ['custom', 'Pick dates']];
function setRange(key) {
  range = key;
  const r = RANGES.find(x => x[0] === key);
  if (key !== 'custom') { rangeFrom = addDays(midnight(new Date()), -r[2]); rangeTo = addDays(midnight(new Date()), -r[3]); }
  // The app loads 14 days; reach further back when the picked dates need it.
  const need = Math.round((midnight(new Date()) - rangeFrom) / 86400000) + 1;
  if (need > loadedDays) { loadedDays = need; refresh(); }
  renderSummary();
}
function rangeDays() {
  const days = [];
  for (let d = rangeFrom; d <= rangeTo; d = addDays(d, 1)) days.push(d);
  return days;
}
function spanText() {
  return +rangeFrom === +rangeTo ? fmtLong(rangeFrom) : fmtLong(rangeFrom) + ' to ' + fmtLong(rangeTo);
}
function inRange() {
  const end = addDays(rangeTo, 1);
  return cache.filter(e => { const t = new Date(e.happenedAt); return t >= rangeFrom && t < end; });
}
// The Event Summary cell starts with its own date and time; the export shows those on their own line.
function summaryBody(e) { return (e.summary || '').replace(/^[A-Z][a-z]{2} \d+\/\d+, \d+:\d+ [AP]M: /, ''); }

function renderSummary() {
  if (!rangeFrom) { setRange(range); return; }
  const r = document.getElementById('range');
  r.innerHTML = '';
  for (const [key, txt] of RANGES) {
    r.append(el('button', { class: 'chip' + (range === key ? ' on' : ''), onclick: () => setRange(key) }, txt));
  }
  const rd = document.getElementById('rangeDates');
  rd.innerHTML = '';
  if (range === 'custom') {
    const today = dateInput(new Date());
    const pick = (lbl, val, set) => {
      const inp = el('input', { type: 'date', value: dateInput(val), max: today });
      inp.onchange = () => {
        if (!inp.value) return;
        set(midnight(new Date(inp.value + 'T00:00')));
        if (rangeFrom > rangeTo) [rangeFrom, rangeTo] = [rangeTo, rangeFrom];
        setRange('custom');
      };
      return el('label', {}, lbl, inp);
    };
    rd.append(el('div', { class: 'dates' }, pick('From', rangeFrom, d => { rangeFrom = d; }), pick('To', rangeTo, d => { rangeTo = d; })));
  } else rd.append(el('div', { class: 'span' }, spanText()));
  const s = document.getElementById('summary');
  s.innerHTML = '';
  const list = inRange();
  const days = rangeDays();
  for (const kid of CFG.kids) {
    const mine = list.filter(e => e.child === kid);
    const good = mine.filter(e => e.type === 'good'), hard = mine.filter(e => e.type === 'hard');
    const card = el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, kid),
      el('div', { class: 'stats' },
        el('div', { class: 'stat good' }, el('b', {}, String(good.length)), 'good moments'),
        el('div', { class: 'stat hard' }, el('b', {}, String(hard.length)), 'hard moments')));
    if (days.length > 1 && days.length <= 31) {
      const max = Math.max(1, ...days.map(d => mine.filter(e => dayKey(new Date(e.happenedAt)) === dayKey(d)).length));
      card.append(el('h3', {}, 'By day'), el('div', { class: 'days' }, days.map(d => {
        const k = dayKey(d);
        const g = good.filter(e => dayKey(new Date(e.happenedAt)) === k).length;
        const h = hard.filter(e => dayKey(new Date(e.happenedAt)) === k).length;
        return el('div', { class: 'day', title: g + ' good, ' + h + ' hard' },
          g ? el('i', { class: 'g', style: 'height:' + (g / max * 100) + '%' }) : null,
          h ? el('i', { class: 'h', style: 'height:' + (h / max * 100) + '%' }) : null);
      })), el('div', { class: 'daylbl' }, days.map(d => el('span', {}, days.length > 7
        ? String(d.getDate()) : d.toLocaleDateString([], { weekday: 'narrow' })))));
    }
    const sec = (title, rows) => rows.length ? [el('h3', {}, title),
      ...rows.slice(0, 6).map(([k, v]) => el('div', { class: 'tally' }, el('span', {}, k), el('span', {}, '×' + v)))] : [];
    if (mine.length > 2) {
      card.append(...sec('Hard moments: what happened', tally(hard, 'what')));
      card.append(...sec('Hard moments: what set it off', tally(hard, 'triggers')));
      card.append(...sec('Hard moments: what helped / what we tried', tally(hard, 'response')));
      card.append(...sec('Hard moments: time of day', tally(hard.map(e => ({ p: partOfDay(e.happenedAt) })), 'p')));
      card.append(...sec('Good moments', tally(good, 'what')));
    }
    if (mine.length) {
      card.append(el('h3', {}, 'Details'), ...mine.slice().reverse().slice(0, 40).map(e => el('div', { class: 'ev' },
        el('div', {}, el('span', { class: 'dot ' + e.type, style: 'display:inline-block;margin:0 6px 0 0' }),
          el('b', {}, label(e)), ' · ' + fmtDay(e.happenedAt) + ' ' + fmtTime(e.happenedAt)),
        e.summary ? el('div', {}, summaryBody(e)) : e.notes ? el('div', {}, '“' + e.notes + '”') : null,
        summaryLine(e) ? el('div', { class: 's' }, summaryLine(e) + ' · by ' + e.by) : null)));
      const to = (CFG.therapists || {})[kid] || [];
      card.append(el('button', { class: 'copy main', style: 'margin-top:14px', onclick: () => emailSummary(kid) },
        to.length ? 'Email ' + kid + '’s therapists' : 'Email ' + kid + '’s summary'),
        el('button', { class: 'copy', style: 'margin-top:8px', onclick: () => shareSummary(kid) }, 'Text or copy instead'));
    } else card.append(el('p', { class: 'empty', style: 'padding:12px 0 0' }, 'Nothing logged on these days.'));
    s.append(card);
  }
}

// Plain text for one child, laid out for a therapist reading it in an email or text:
// counts first, then each moment in time order with the summary and the picked details on labeled lines.
function summaryText(kid) {
  const mine = inRange().filter(e => e.child === kid).slice().reverse();
  const good = mine.filter(e => e.type === 'good'), hard = mine.filter(e => e.type === 'hard');
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const list = rows => rows.slice(0, 5).map(([k, v]) => v > 1 ? k + ' (' + v + ')' : k).join(', ');
  const out = [kid + ' – home behavior log', spanText(), plural(hard.length, 'hard moment') + ', ' + plural(good.length, 'good moment')];
  if (mine.length > 2) {
    out.push('', 'AT A GLANCE');
    const line = (t, rows) => { if (rows.length) out.push('• ' + t + ': ' + list(rows)); };
    line('Hard moments were mostly', tally(hard, 'what'));
    line('Common triggers', tally(hard, 'triggers'));
    line('What we did', tally(hard, 'response'));
    line('Time of day', tally(hard.map(e => ({ p: partOfDay(e.happenedAt) })), 'p'));
    line('Good moments were mostly', tally(good, 'what'));
  }
  for (const e of mine) {
    out.push('', '————————————', label(e).toUpperCase() + ' · ' + fmtLong(new Date(e.happenedAt)) + ' at ' + fmtTime(e.happenedAt), '');
    // Prefer the Event Summary cell (written by Gemini, editable in the Sheet); fall back to the notes.
    const body = summaryBody(e) || e.notes;
    if (body) out.push(body, '');
    const item = (t, v) => { if (v) out.push('• ' + t + ': ' + v); };
    item('What happened', e.what.join(', '));
    item('How big / how long', [e.intensity, e.duration].filter(Boolean).join(', '));
    item('Set off by', e.triggers.join(', '));
    item(e.type === 'good' ? 'How we responded' : 'What we did', e.response.join(', '));
    item('Logged by', e.by);
  }
  return out.join('\n');
}

// Opens a new email in the phone's mail app, addressed to the child's therapists, with the other parent copied.
// A mailto link keeps the line breaks that Mail and Gmail lose from share-sheet text.
function emailSummary(kid) {
  const to = (CFG.therapists || {})[kid] || [];
  const cc = Object.entries(CFG.parents || {}).filter(([n]) => n !== who).map(([, a]) => a);
  const subject = kid + ' – home behavior log, ' + spanText();
  const q = [['subject', subject], ['body', summaryText(kid).replace(/\n/g, '\r\n')]];
  if (cc.length) q.unshift(['cc', cc.join(',')]);
  location.href = 'mailto:' + to.join(',') + '?' +
    q.map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
}

// iPhone share sheet when available (Messages, Notes), otherwise the clipboard.
async function shareSummary(kid) {
  const text = summaryText(kid);
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('Copied ' + kid + '’s summary. Paste it into a text or email'); }
  catch (e) { toast('Couldn’t copy on this device'); }
}

// ---------- tabs / boot ----------
function showTab(t) {
  document.getElementById('viewLog').style.display = t === 'log' ? '' : 'none';
  document.getElementById('viewSum').style.display = t === 'sum' ? '' : 'none';
  document.getElementById('tabLog').className = t === 'log' ? 'on' : '';
  document.getElementById('tabSum').className = t === 'sum' ? 'on' : '';
  if (t === 'sum') { renderSummary(); refresh(); }
}

async function refresh() {
  try {
    cache = await call('getEntries', loadedDays);
    renderToday();
    if (document.getElementById('viewSum').style.display !== 'none') renderSummary();
  } catch (e) {
    document.getElementById('today').innerHTML = '<div class="empty">Couldn’t load the log. Check your connection.</div>';
  }
}

async function boot() {
  if (!KEY) { locked('This link is missing its family key. Type the key from the full link (the part after k=), or ask whoever shared Kid Log with you.'); return; }
  try { CFG = await call('config'); }
  catch (e) {
    locked(e.message === 'bad key' ? 'This family key doesn’t work. Ask for the current link.'
      : 'Couldn’t reach Kid Log. Check your connection, then reopen the app.');
    return;
  }
  store('key', KEY);
  // Put the key in the address so Add to Home Screen saves a link that keeps working.
  if (new URLSearchParams(location.search).get('k') !== KEY) history.replaceState(null, '', '?k=' + KEY);
  renderWho();
  renderGrid();
  if (!who) pickWho();
  refresh();
}
function locked(msg) {
  document.querySelector('.tabs').style.display = 'none';
  document.getElementById('whoBtn').style.display = 'none';
  document.getElementById('viewLog').innerHTML = '';
  const inp = el('input', { type: 'text', placeholder: 'Family key', autocapitalize: 'off', autocomplete: 'off',
    spellcheck: 'false', style: 'width:100%;font:inherit;padding:12px;margin-top:12px;border-radius:12px;' +
      'border:1px solid var(--line);background:var(--bg);color:var(--ink)' });
  const go = () => { const k = inp.value.trim().replace(/^.*k=/, ''); if (k) location.href = location.pathname + '?k=' + encodeURIComponent(k); };
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('viewLog').append(el('div', { class: 'card' }, msg, inp,
    el('button', { class: 'save good', style: 'margin-top:12px', onclick: go }, 'Open Kid Log')));
}
window.addEventListener('hashchange', () => location.reload());
boot();
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
